<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Casa Magnolia · Recorrido 3D V2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee8de;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#v{position:absolute;inset:0}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}
button,.tag{border:1px solid #d2c8bb;background:rgba(255,255,255,.92);border-radius:14px;padding:10px 12px;color:#292621;font-size:13px}
button{pointer-events:auto}.bottom{position:absolute;bottom:12px;left:12px;right:12px;background:rgba(255,255,255,.92);border-radius:14px;padding:9px 12px;font-size:12px;color:#5b554e}
</style></head><body><div id="v"></div>
<div class="top"><span class="tag">Casa Magnolia · V2</span><button id="a">Axonométrica</button><button id="exp">Entrada experiencial</button><button id="rev">Revelación</button><button id="cor">Corazón</button><button id="cot">Acceso cotidiano</button></div>
<div class="bottom">Arrastra para mirar · Pellizca para zoom · Usa los botones para comprobar los recorridos y visuales.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import {OrbitControls} from 'three/addons/controls/OrbitControls.js'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('v').appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0xeee8de);const c=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.05,100);
const o=new OrbitControls(c,r.domElement);o.enableDamping=true;o.minDistance=.7;o.maxDistance=50;o.maxPolarAngle=Math.PI*.49;
s.add(new THREE.HemisphereLight(0xffffff,0x71675c,2.5));const d=new THREE.DirectionalLight(0xffffff,3);d.position.set(7,-8,18);s.add(d);
new GLTFLoader().load('./Casa_Magnolia_3D_V2_Arquitectura.glb',g=>s.add(g.scene),undefined,e=>alert('No se pudo cargar el modelo 3D. Verifica que el archivo GLB esté en el mismo repositorio que index.html.'));
function go(p,t){c.position.set(...p);o.target.set(...t);o.update()}
document.getElementById('a').onclick=()=>go([23,-24,21],[10,7.5,1]);
document.getElementById('exp').onclick=()=>go([1.55,-1.6,1.62],[2.8,2.3,1.55]);
document.getElementById('rev').onclick=()=>go([6.7,4.1,1.62],[10,6.5,1.5]);
document.getElementById('cor').onclick=()=>go([10,4.0,1.62],[10,6.5,1.35]);
document.getElementById('cot').onclick=()=>go([17.65,-1.5,1.62],[17.2,2.0,1.55]);
go([23,-24,21],[10,7.5,1]);
addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
r.setAnimationLoop(()=>{o.update();r.render(s,c)});
</script></body></html>
