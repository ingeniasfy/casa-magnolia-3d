const blob=new Blob([bytes],{type:"model/gltf-binary"});
const url=URL.createObjectURL(blob);
new GLTFLoader().load(url,g=>{
  scene.add(g.scene);
  g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  URL.revokeObjectURL(url);
},undefined,e=>document.getElementById('msg').textContent="No se pudo cargar el modelo: "+e.message);

function general(){
 camera.position.set(23,-24,22); controls.target.set(10,7.5,1.1); controls.update();
}
function human(){
 camera.position.set(1.55,-1.7,1.62); controls.target.set(3.2,2.3,1.55); controls.update();
}
document.getElementById('reset').addEventListener('click',general);
document.getElementById('human').addEventListener('click',human);

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script>
